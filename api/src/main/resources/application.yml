spring:
  application:
    name: campuspulse-api
  datasource:
    url: jdbc:postgresql://localhost:5432/campuspulse
    username: postgres
    # Read from the environment so no password lives in the repo. Each developer sets
    # CAMPUSPULSE_DB_PASSWORD to their own local Postgres superuser password.
    password: ${CAMPUSPULSE_DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only VALIDATES that entities match it, and
      # never alters it. This is what keeps the DB rebuildable and honest for the demo.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # The app runs migrations on boot too, against the same files the maven plugin uses.
    locations: classpath:db/migration

server:
  port: 8080
